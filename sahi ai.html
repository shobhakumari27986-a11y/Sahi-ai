<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahi AI Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }
        body, html {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f2f5;
        }
        .app-window {
            width: 100%;
            max-width: 500px;
            height: 100%;
            max-height: 500px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-color: #0096DC;
            /* REPLACEMENT: Change 'Screenshot 2026-10-15 163657.png' to your web image path */
            background-image: url('Screenshot 2026-10-15 163657.png');
            background-size: cover;
            background-position: center;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            z-index: 1;
        }
        h1 {
            font-family: 'Imprint MT Shadow', serif;
            font-size: 30px;
            font-weight: bold;
            color: black;
            margin-top: 30px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.6);
        }
        .input-container {
            margin-top: 80px;
            width: 100%;
            display: flex;
            justify-content: center;
        }
        input[type="text"] {
            width: 320px;
            height: 35px;
            padding: 0 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            outline: none;
            background-color: white;
            color: black;
        }
        .button-container {
            margin-top: 35px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        .canvas-btn {
            font-size: 14px;
            font-weight: bold;
            color: #0096DC;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .canvas-btn:hover {
            color: white;
        }
        .result-container {
            margin-top: auto;
            margin-bottom: 20px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            font-size: 13px;
            color: black;
            line-height: 1.4;
            padding: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="app-window">
        <div class="overlay">
            <h1>Sahi ai</h1>

            <div class="input-container">
                <input type="text" id="question" placeholder="Type here...">
            </div>

            <div class="button-container">
                <button class="canvas-btn" onclick="handleSend()">[ SEND ]</button>
                <button class="canvas-btn" onclick="handleOpen()">[ OPEN ]</button>
            </div>

            <div class="result-container" id="resultDisplay">
                Your results will appear here...
            </div>
        </div>
    </div>

    <script>
        function updateScreen(text) {
            document.getElementById('resultDisplay').innerText = text;
            speakText(text);
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Terminate old tracks immediately
                let utterance = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(utterance);
            }
        }

        async function handleSend() {
            let inputField = document.getElementById('question');
            let userInput = inputField.value.trim();

            if (!userInput) return;

            let cleanQuery = userInput.toLowerCase().replace("wikipedia", "").replace("search", "").replace("google", "").trim();

            if (userInput.toLowerCase().includes("google")) {
                updateScreen("Searching Google for: " + cleanQuery);
                window.open("https://google.com" + encodeURIComponent(cleanQuery), "_blank");
                return;
            }

            updateScreen("Searching Wikipedia...");

            try {
                // Call Wikipedia API directly over standard Web HTTP requests
                let url = `https://wikipedia.org{encodeURIComponent(cleanQuery)}`;
                let response = await fetch(url);

                if (response.ok) {
                    let data = await response.json();
                    if (data.extract) {
                        updateScreen(data.extract);
                    } else {
                        throw new Error();
                    }
                } else {
                    throw new Error();
                }
            } catch (error) {
                updateScreen("Wikipedia match not found. Searching Google instead...");
                window.open("https://google.com" + encodeURIComponent(cleanQuery), "_blank");
            }
        }

        function handleOpen() {
            let inputField = document.getElementById('question');
            let userInput = inputField.value.trim().toLowerCase();

            if (userInput.includes('youtube')) {
                updateScreen("Opening YouTube...");
                let searchClean = userInput.replace("open", "").replace("youtube", "").trim();
                window.open('https://youtube.com' + encodeURIComponent(searchClean), '_blank');
            } else if (userInput.includes('whatsapp')) {
                updateScreen("Opening WhatsApp Web...");
                window.open('https://whatsapp.com', '_blank');
            } else if (userInput.includes('google')) {
                updateScreen("Opening Google...");
                window.open('https://google.com', '_blank');
            } else {
                updateScreen("Command not recognized. Try typing open YouTube, open WhatsApp, or open Google.");
            }
        }
    </script>
</body>
</html>
